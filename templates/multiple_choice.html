```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Choice Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">

    <style>
        .choice-button {
            margin-bottom: 10px;
            width: 80%;
        }

        .choice-button:hover {
            box-shadow: 0 0 5px #007bff;
            border-color: #007bff;
            color: #495057;
            background-color: white;
        }

        .center-text {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .feedback-correct {
            color: #198754;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .feedback-incorrect {
            color: #dc3545;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .correct-answer {
            color: #198754;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h1 class="center-text">Multiple Choice</h1>

        <div id="question-info" class="center-text">
            <p>Question ID: {{ question_id }}</p>
            <h3>{{ term }}</h3>
        </div>

        <form method="POST" action="{{ url_for('study_multiple_choice') }}">
            <input type="hidden" name="question_id" value="{{ question_id }}">
            <input type="hidden" name="correct_answer" value="{{ correct_answer }}">

            <div id="choices-container"
                 class="d-flex flex-column align-items-center">

                {% for choice in choices %}
                <button
                    type="submit"
                    name="answer"
                    value="{{ loop.index0 }}"
                    class="btn btn-outline-primary choice-button"
                    {% if feedback %}disabled{% endif %}>
                    {{ choice }}
                </button>
                {% endfor %}

            </div>
        </form>

        {% if feedback %}
        <div id="feedback-container" class="center-text mt-4">

            {% if is_correct %}
                <p class="feedback-correct">✓ Correct!</p>
                <script>
                    setTimeout(function () {
                        window.location.href = "{{ url_for('study_multiple_choice') }}";
                    }, 700);
                </script>
            {% else %}
                <p class="feedback-incorrect">✗ Incorrect!</p>

                <p>The correct answer was:</p>
                <p class="correct-answer">{{ correct_answer }}</p>
            {% endif %}

            <button
                type="button"
                class="btn btn-primary mt-3"
                onclick="window.location.href='{{ url_for('study_multiple_choice') }}';">
                Next Question
            </button>

        </div>
        {% endif %}
    </div>

    <script>
        const choiceMap = {
            a: 0,
            s: 1,
            d: 2,
            f: 3,
        };

        document.addEventListener('keydown', function (event) {
            const key = event.key.toLowerCase();
            const nextButton = document.querySelector('#feedback-container button');

            if (event.target && ['INPUT', 'TEXTAREA'].includes(event.target.tagName)) {
                return;
            }

            if (key === ' ' && nextButton) {
                event.preventDefault();
                nextButton.click();
                return;
            }

            if (Object.hasOwn(choiceMap, key)) {
                const choiceIndex = choiceMap[key];
                const choiceButton = document.querySelectorAll('button[name="answer"]')[choiceIndex];

                if (choiceButton && !choiceButton.disabled) {
                    event.preventDefault();
                    choiceButton.click();
                }
            }
        });
    </script>
</body>
</html>
